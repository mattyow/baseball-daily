# No build step — index.html is served as-is from the repo root.

[build]
  publish = "."
  functions = "netlify/functions"

# Always revalidate the page itself so design tweaks appear on reload
# instead of waiting out a cached copy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
